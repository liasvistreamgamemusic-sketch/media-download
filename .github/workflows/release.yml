name: Release

# タグ v* を push するとトリガー。各OSランナーがアプリをビルドし、成果物を
# GitHub Release（ドラフト）にアップロードする。他プロジェクト向けの core パッケージ
# （packages/core）の tarball も同じ Release に添付する。
on:
  push:
    tags:
      - 'v*'
  # 手動実行は既存タグの作り直し用。main のワークフロー定義で、指定したタグの
  # コードをビルドし、そのタグの Release に添付する。
  workflow_dispatch:
    inputs:
      tag:
        description: 'ビルドして Release に添付するタグ（例: v1.5.0）'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            args: --win
            fetch: npm run fetch-binaries
          # Apple Silicon ランナーで Intel+arm64 ユニバーサル app をビルド
          # （Intel 専用 macos-13 ランナーの空き待ちを回避）。
          - os: macos-15
            label: macOS (universal)
            args: --mac --universal
            fetch: npm run fetch-binaries -- --mac-universal

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch yt-dlp / ffmpeg / ffprobe (static)
        run: ${{ matrix.fetch }}

      - name: Unit tests
        run: npm test

      - name: Build (electron-vite)
        run: npm run build

      # 発行はせずローカルにパッケージのみ作成（electron-builder の publisher は
      # 大容量アップロードで不安定なため使わない）。
      - name: Package (electron-builder)
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never

      # 堅牢なアップローダで Release（ドラフト）に成果物を追加。
      # 複数ジョブが同じタグの Release を find-or-create して追記する。
      - name: Upload to GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  core-package:
    name: core package (tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test core
        run: npm run typecheck:core && npm test -w packages/core

      # prepack で dist をビルドしてから tarball を作る。
      # npm は --pack-destination のフォルダを作らないので先に用意する。
      - name: Pack
        run: mkdir -p pack && npm pack -w packages/core --pack-destination pack

      - name: Upload to GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: pack/*.tgz
